name: Deploy till Firebase

# Körs automatiskt varje gång något pushas till main - t.ex. när Claude
# committar en fix, eller om du själv redigerar en fil direkt på
# github.com. Ingen dator, terminal eller Firebase CLI behövs för det
# vanliga fallet - GitHub sköter build + deploy åt dig.
#
# "workflow_dispatch" lägger dessutom till en knapp under fliken
# "Actions" på GitHub, så att du kan trycka på "Run workflow" och
# deploya manuellt om du någon gång behöver göra om en deploy utan
# att ändra någon fil.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sätt upp Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Cacha Next.js-bygget
        uses: actions/cache@v4
        with:
          path: .next/cache
          # Cachen delas mellan körningar med samma källkod+lockfile;
          # om inget exakt matchar återanvänds ändå senaste cachen som
          # bas (restore-keys), vilket gör inkrementella bygg snabbare
          # även när något ändrats sen sist.
          key: nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx') }}
          restore-keys: |
            nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Installera root-beroenden
        run: npm ci

      - name: Installera functions-beroenden
        run: npm ci --prefix functions

      - name: Skapa .env.local från GitHub Secrets
        run: |
          cat > .env.local << EOF
          NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_USE_FIREBASE_EMULATORS=false
          EOF

      - name: Installera Firebase CLI
        run: npm install -g firebase-tools

      - name: Skriv Google service account-nyckel till fil
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/gcp-key.json

      - name: Aktivera webframeworks-stöd
        run: firebase experiments:enable webframeworks

      - name: Deploya till Firebase
        run: firebase deploy --non-interactive --project varannan-familj
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-key.json
