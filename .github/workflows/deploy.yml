name: Deploy till Firebase (manuell)

# INGEN automatisk trigger. Deployen sker ALDRIG av sig själv vid push —
# den startas bara när du själv trycker "Run workflow" under fliken
# Actions på GitHub (fungerar även i GitHub-appen på mobilen).
#
# Det här är avsiktligt: en tidigare version av den här filen körde
# "firebase deploy" vid varje push till main, parallellt med de lokala
# deploy.bat-körningarna. Två samtidiga deploys mot samma projekt gav
# bland annat en 409-konflikt på SSR-funktionen.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Vad ska deployas?"
        required: true
        default: "hosting"
        type: choice
        options:
          - hosting
          - functions
          - hosting,functions
          - firestore:rules
          - hosting,functions,firestore:rules
      delete_functions:
        description: "Tillåt radering av funktioner som saknas i koden (--force). Lämna avbockat om du inte är säker."
        required: false
        default: false
        type: boolean

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Kräver godkännande och bara från main (se miljöinställningarna på GitHub).
    environment: Production
    # Kör aldrig två deploys samtidigt — den andra får vänta i kö
    # istället för att kollidera med den första.
    concurrency:
      group: firebase-deploy
      cancel-in-progress: false
    # contents: write behövs för att flytta taggen production efter deploy.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Hela historiken och taggarna, så att kontrollen nedan går att göra.
          fetch-depth: 0
          fetch-tags: true

      - name: Sätt upp Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Installera root-beroenden
        run: npm ci

      - name: Installera functions-beroenden
        run: npm ci --prefix functions

      - name: Skapa .env.local från GitHub Secrets
        run: |
          cat > .env.local << EOF
          NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_VAPID_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_VAPID_KEY }}
          NEXT_PUBLIC_CALENDAR_FEED_URL=${{ secrets.NEXT_PUBLIC_CALENDAR_FEED_URL }}
          NEXT_PUBLIC_USE_FIREBASE_EMULATORS=false
          EOF

      - name: Bygg frontend (statisk export till out/)
        if: contains(github.event.inputs.target, 'hosting')
        run: npm run build

      - name: Kontrollera att bygget har rätt Firebase-inställningar
        # Stoppar deployen om appen byggts utan Firebase-inställningar. Då
        # skulle inloggningen krascha för alla användare. Hände 2026-10-21.
        if: contains(github.event.inputs.target, 'hosting')
        run: |
          if ! grep -rq "varannan-familj.firebaseapp.com" out/_next; then
            echo "Bygget saknar Firebase-inställningarna. Avbryter deployen."
            exit 1
          fi
          if grep -rq 'apiKey:"-"' out/_next; then
            echo "Bygget innehåller platshållare för Firebase. Avbryter deployen."
            exit 1
          fi
          echo "OK: Firebase-inställningarna finns i bygget."

      - name: Installera Firebase CLI
        run: npm install -g firebase-tools

      - name: Skriv Google service account-nyckel till fil
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/gcp-key.json

      - name: Kör tester före deploy
        # Om något test misslyckas stoppas deployen här.
        run: |
          npm test
          firebase emulators:exec --only firestore "npm run test:rules"

      - name: Kontrollera att production-taggen finns i historiken
        # Avbryter om koden inte innehåller den commit som produktionen kör.
        # Då kan vi inte rulla tillbaka till en version som inte finns i main.
        run: |
          if ! git rev-parse -q --verify refs/tags/production >/dev/null; then
            echo "Taggen production saknas. Avbryter."
            exit 1
          fi
          if ! git merge-base --is-ancestor production HEAD; then
            echo "Taggen production ligger inte i historiken för HEAD. Avbryter."
            exit 1
          fi
          echo "OK: production ($(git rev-parse --short production)) ligger i historiken för HEAD."

      - name: Deploya
        # --force gör att CLI:t raderar funktioner som finns kvar i produktion
        # men inte i lokal källkod. Det är farligt (en incident 2026-10-21
        # raderade 18 funktioner), så det används bara om delete_functions
        # är ikryssat. Utan --force avbryter CLI:t i stället för att radera.
        run: |
          FORCE=""
          if [ "${{ github.event.inputs.delete_functions }}" = "true" ]; then
            FORCE="--force"
          fi
          firebase deploy --only ${{ github.event.inputs.target }} --non-interactive $FORCE --project varannan-familj
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-key.json
          FIREBASE_SUPPRESS_REGION_WARNING: "true"

      - name: Flytta taggen production till den deployade commiten
        # Körs bara om deployen lyckades (standard i GitHub Actions).
        run: |
          git config user.name "varannan-bot"
          git config user.email "bot@varannan.local"
          git tag -f -a production -m "Deployad från $GITHUB_SHA ($(date -u +%Y-%m-%dT%H:%M:%SZ))" "$GITHUB_SHA"
          git push -f origin production
