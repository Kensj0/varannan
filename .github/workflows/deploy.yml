name: Deploy till Firebase (manuell)

# INGEN automatisk trigger. Deployen sker ALDRIG av sig själv vid push —
# den startas bara när du själv trycker "Run workflow" under fliken
# Actions på GitHub (fungerar även i GitHub-appen på mobilen).
#
# Det här är avsiktligt: en tidigare version av den här filen körde
# "firebase deploy" vid varje push till main, parallellt med de lokala
# deploy.bat-körningarna. Två samtidiga deploys mot samma projekt gav
# bland annat en 409-konflikt på SSR-funktionen.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Vad ska deployas?"
        required: true
        default: "hosting"
        type: choice
        options:
          - hosting
          - functions
          - hosting,functions
          - firestore:rules
          - hosting,functions,firestore:rules

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Kör aldrig två deploys samtidigt — den andra får vänta i kö
    # istället för att kollidera med den första.
    concurrency:
      group: firebase-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sätt upp Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Installera root-beroenden
        run: npm ci

      - name: Installera functions-beroenden
        run: npm ci --prefix functions

      - name: Skapa .env.local från GitHub Secrets
        run: |
          cat > .env.local << EOF
          NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_VAPID_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_VAPID_KEY }}
          NEXT_PUBLIC_CALENDAR_FEED_URL=${{ secrets.NEXT_PUBLIC_CALENDAR_FEED_URL }}
          NEXT_PUBLIC_USE_FIREBASE_EMULATORS=false
          EOF

      - name: Bygg frontend (statisk export till out/)
        if: contains(github.event.inputs.target, 'hosting')
        run: npm run build

      - name: Installera Firebase CLI
        run: npm install -g firebase-tools

      - name: Skriv Google service account-nyckel till fil
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/gcp-key.json

      - name: Deploya
        # --force krävs för att CLI:t ska få radera funktioner som finns
        # kvar i produktion men inte i lokal källkod (t.ex. gamla
        # regionversioner efter en regionflytt) — annars avbryter den
        # icke-interaktivt istället för att fråga.
        run: firebase deploy --only ${{ github.event.inputs.target }} --non-interactive --force --project varannan-familj
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-key.json
          FIREBASE_SUPPRESS_REGION_WARNING: "true"
