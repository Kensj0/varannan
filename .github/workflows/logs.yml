name: Hämta Cloud Functions-loggar

# Diagnostik, inte deploy. Skriver ut de senaste loggraderna från en
# vald funktion så att ett "INTERNAL"-fel i appen går att spåra till
# den faktiska stacktracen, utan att behöva sitta vid en dator med
# Firebase CLI installerat.
on:
  workflow_dispatch:
    inputs:
      function:
        description: "Vilken funktion? (tom = alla)"
        required: false
        default: "approveShiftRequest"
      lines:
        description: "Antal rader"
        required: false
        default: "80"

permissions:
  # Krävs för att kunna pusha loggen till grenen "diagnostics".
  contents: write

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Installera Firebase CLI
        run: npm install -g firebase-tools

      - name: Skriv Google service account-nyckel till fil
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/gcp-key.json

      - name: Checkout
        uses: actions/checkout@v4

      - name: Hämta loggar via Cloud Logging
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-key.json
        run: |
          mkdir -p diagnostics
          gcloud auth activate-service-account --key-file=/tmp/gcp-key.json
          gcloud config set project varannan-familj

          # "firebase functions:log" blandar in audit-poster från varje
          # deploy, som snabbt tränger undan de faktiska körningarna.
          # Cloud Logging-filtret nedan tar bara körningsloggar (Cloud Run-
          # revisioner, dit gen2-funktioner skriver) och hoppar över audit.
          # Hoppa över instansstart/hälsokontroller — de säger inget om
          # varför ett anrop misslyckas och tränger undan de rader som gör det.
          FILTER='resource.type="cloud_run_revision"
            AND NOT textPayload:"Starting new instance"
            AND NOT textPayload:"STARTUP TCP probe"'
          if [ -n "${{ github.event.inputs.function }}" ]; then
            SVC=$(echo "${{ github.event.inputs.function }}" | tr "[:upper:]" "[:lower:]")
            FILTER="$FILTER AND resource.labels.service_name=\"$SVC\""
          fi

          gcloud logging read "$FILTER" \
            --limit="${{ github.event.inputs.lines }}" \
            --format="value(timestamp, severity, resource.labels.service_name, httpRequest.status, textPayload, jsonPayload.message, protoPayload.status.message)" \
            > diagnostics/functions-log.txt 2>&1 || true

          echo "--- senaste raderna ---"
          head -40 diagnostics/functions-log.txt

      # Loggen committas till grenen "diagnostics" så den går att läsa via
      # git. Körningsloggarna i Actions ligger bakom en separat domän som
      # inte alltid är åtkomlig. Egen gren, för att inte skräpa ner main.
      - name: Publicera loggen på grenen diagnostics
        run: |
          git config user.name "varannan-bot"
          git config user.email "bot@varannan.local"
          git checkout -B diagnostics
          git add -f diagnostics/functions-log.txt
          git commit -m "Loggar $(date -u +%Y-%m-%dT%H:%M:%SZ)" || exit 0
          git push -f origin diagnostics
